# APERO instruments configuration (bash-friendly .conf)
# Define instruments and their install scripts, plus git repos and branches.
# Format:
# [instrument]
# install_script=script_name.sh
# repo=dir_name branch=branch_name
# (repeat repo lines as needed)

[spirou]
install_script=apero_install_spirou.sh
repo=apero_drs_07 branch=v0.7.296-live
repo=apero-utils branch=developer
repo=lbl branch=apero_07

[nirps]
install_script=apero_install_nirps.sh
repo=apero_drs_07 branch=v0.7.296-live
repo=apero-utils branch=developer
repo=lbl branch=apero_07
