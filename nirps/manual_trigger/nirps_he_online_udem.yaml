nirps_he_online_udem:
    # general settings
    general:
        # instrument
        activate_instrument: nirps
        # profile (is in apero-activate)
        activate_profile: nirps_he_online
        # directory where raw data is downloaded
        raw dir: /nirps_raw/nirps/raw-data/nirps_he
        # whether to link raw symlinks
        raw sym links: True
        # the apero profile to use (controlled sym link raw data directory and all
        #    apero reduced data directories)
        apero profile: /cosmos99/nirps/apero-settings/nirps_he_online
        # the install directory for apero (git hub repo)
        apero install: /cosmos99/nirps/git-bin/apero-drs-online
        # apero get output path
        lbl path: /cosmos99/nirps/lbl-data/nirps_he_online/lbl
        # apero version
        apero version: 0.7.XXX
        # start date if not using --obsdir argument
        start date: 2022-11-01
    # batch mode settings (cannot run multiple profiles in a single yaml in batch mode)
    batch:
      # whether to run in batch mode
      run batch: False
    # apero_processing settings
    processing:
        # apero processing run.ini file
        run file: online_run.ini
        cores: 5
        # reset data
        #  options are "None", "all" or a list "tmp", "red", "out"
        reset:
            - None
    # apero_get settings
    get-obj:
        # path to copy everything to
        out path: /cosmos99/nirps/apero-data/nirps_he_online/objects
        # science fiber(s) to get
        science fibers:
            - A
        calib fibers:
            - B
        # apero get valid header key: DRSOUTID (for apero red dir)
        science out types:
            - EXT_E2DS_FF
            - EXT_S1D_V
            - TELLU_OBJ
            - TELLU_RECON
            - TELLU_PCLEAN
            - SC1D_V_FILE
            - RC1D_V_FILE
            - CCF_RV
            - DRS_POST_E
            - DRS_POST_S
            - DRS_POST_T
            - DRS_POST_V
            - DRS_POST_P
            - EXT_S1D_W
            - SC1D_W_FILE
            - RC1D_W_FILE
        # input dpr types
        science dpr types:
            - OBJ_FP
            - OBJ_DARK
            - OBJ_SKY
            - TELLU_SKY
        # apero template types
        template out types:
            - TELLU_TEMP
            - TELLU_TEMP_S1DV
        # sym links in apero get
        symlinks: True
        # reset options (if symlinks = True)
        reset:
            # - objects
    # apero_get settings for comm directory
    get-comm:
        # path to copy everything to
        out path: /cosmos99/nirps/apero-data/nirps_he_online/comm
        # apero get valid header key: DRSOUTID (for apero red dir)
        science out types:
            - DRS_POST_E
            - DRS_POST_S
            - DRS_POST_T
            - DRS_POST_V
            - DRS_POST_P
        # input dpr types
        science dpr types:
            - OBJ_FP
            - OBJ_DARK
            - OBJ_SKY
        # apero template types
        template out types:
            - TELLU_TEMP
            - TELLU_TEMP_S1DV
            - TELLU_TEMP_S1DW
        # permissions file
        permissions file: /cosmos99/nirps/git-bin/apero-drs-online/apero/tools/resources/get/nirps_permissions.yaml
        # group permissions file
        group file: /cosmos99/nirps/git-bin/apero-drs-online/apero/tools/resources/get/apero_groups.yaml
        # group server
        group server: udem_astro
        # out suffix
        out suffix:
        # out prefix
        out prefix: 'APERO_v0.7_'
    # ari-settings
    ari:
        # ari profile
        profile: nirps_he_online_udem.yaml
        # mode (options are "old", "new" or "both")
        mode: both
        # local ari directory
        ari path: /cosmos99/nirps/apero-data/nirps_he_online/other/ari-local
        # apero aprofile (from apero_ri)
        ari profile: nirps_he_v7.yaml
        # cores to use for ari
        cores: 5
        # multiprocessing backend for ari (options are "threads", "processes")
        mp_backend: processes
        # multiprocessing start method for ari (options are "default", "fork", "spawn", "forkserver")
        mp_start_method: fork
    # check settings
    check:
        # whether to run check
        run_check: True
        # check path
        path: /cosmos99/nirps/git-bin/apero-utils/nirps/apero_check
        # profile
        profile: nirps_he_online_udem.yaml
        # define the raw sheet name for the google sheet
        raw sheet name: RAW-NIRPS-HE
        raw page id: 1741354113
        # define the red sheet name for the google sheet
        red sheet name: RED-ONLINE-NIRPS-HE
        red page id: 541545005
        # define the comm sheet name for the google sheet
        comments page id: 68390787
        # define the google sheet id
        raw sheet id: 1zvU_XFA1ZOJE111qZKiav7v6ptYveWpDkMHjdhiN06M
        red sheet id: 1zvU_XFA1ZOJE111qZKiav7v6ptYveWpDkMHjdhiN06M
        over sheet id: 1zvU_XFA1ZOJE111qZKiav7v6ptYveWpDkMHjdhiN06M
        # disable dependencies check
        disable dependencies check: False
        # critical check files (from nirpsdl)
        critical csv file: /nirps_raw/nirps/critical-checks-output/check_status.csv
        critical desc file: /cosmos99/nirps/git-bin/nirpsdl/assets/critical_checks_description.csv
        # system disk path
        system disk path: /cosmos99
        # system email server
        system email server: localhost
