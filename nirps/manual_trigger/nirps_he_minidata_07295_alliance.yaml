nirps he online:
    # general settings
    general:
        # directory where raw data is downloaded
        raw dir: /project/6102120/apero/nirps_data/internal/nirps_raw/raw-data/nirps_he
        # the apero profile to use (controlled sym link raw data directory and all
        #    apero reduced data directories)
        apero profile: /project/6102120/apero/nirps_bin/settings/nirps_he_minidata_07295
      # the install directory for apero (git hub repo)
        apero install: /project/6102120/apero/nirps_bin/scripts/apero_drs_07
        # directory where lbl files are processed
        lbl path: /project/6102120/apero/nirps_data/private/nirps_he_minidata_07295/lbl
        # start date if not using --obsdir argument
        start date: 2022-11-01
    # apero_processing settings
    processing:
        # apero processing run.ini file
        run file: mini_run.ini
        # reset data
        #  options are "None", "all" or a list "tmp", "red", "out"
        reset:
            - None
    # apero_get settings
    get:
        science fibers:
            - A
        calib fibers:
            - B
        # apero get valid header key: DRSOUTID (for apero red dir)
        science out types:
            - EXT_E2DS_FF
            - EXT_S1D_V
            - TELLU_OBJ
            - TELLU_RECON
            - TELLU_PCLEAN
            - SC1D_V_FILE
            - RC1D_V_FILE
            - CCF_RV
            - DRS_POST_E
            - DRS_POST_S
            - DRS_POST_T
            - DRS_POST_V
            - DRS_POST_P
            - EXT_S1D_W
            - SC1D_W_FILE
            - RC1D_W_FILE
        # input dpr types
        science dpr types:
            - OBJ_FP
            - OBJ_DARK
            - OBJ_SKY
            - TELLU_SKY
        # apero template types
        template out types:
            - TELLU_TEMP
            - TELLU_TEMP_S1DV
        # sym links in apero get
        symlinks: True
        # reset options (if symlinks = True)
        reset:
            # - objects
    # apero_get settings for lbl
    get-lbl:
        science fibers:
            - A
        calib fibers:
            - B
        # input telluric
        science out types:
            - TELLU_OBJ
        # input dpr types
        science dpr types:
            - OBJ_FP
            - OBJ_DARK
            - OBJ_SKY
        # apero template types
        template out types:
            - TELLU_TEMP_S1DV
        # apero simultaneous FP dprtypes
        simfp dprtypes:
            - OBJ_FP
        # sym links in apero get
        symlinks: True
        # reset options (if symlinks = True)
        reset:
            - science
            - telluric
            - calib
    # ari-settings
    ari:
        # ari profile
        profile: nirps_he_online_alliance.yaml
    # check settings
    check:
        # whether to run check
        run_check: True
        # check path
        path: /project/6102120/apero/nirps_bin/scripts/apero-utils/nirps/apero_check
        # profile
        profile: nirps_he_profile_mini_alliance.yaml
        # define the raw sheet name for the google sheet
        raw sheet name: RAW-NIRPS-HE
#        raw sheet checks id: 1741354113
        # define the red sheet name for the google sheet
        red sheet name: RED-ONLINE-NIRPS-HE
#        raw sheet checks id: 1017212188
      # define the comm sheet name for the google sheet
        comments sheet id: 68390787
        # define the google sheet id
        raw sheet id: 16Aorq8WeGKmEQ_wRoeyzCVrIWpqocC3TS1CciqEfTP8
        red sheet id: 16Aorq8WeGKmEQ_wRoeyzCVrIWpqocC3TS1CciqEfTP8
        over sheet id: 16Aorq8WeGKmEQ_wRoeyzCVrIWpqocC3TS1CciqEfTP8
        # disable dependencies check
        # TODO: set to False when not testing
        disable dependencies check: True
        # critical check files (from nirpsdl)
        # TODO: update these
        # critical csv file: /nirps_raw/nirps/nirps/critical-checks-output/check_status.csv
        # critical desc file: /cosmos99/nirps/git-bin/nirpsdl/assets/critical_checks_description.csv
        critical csv file: 'None'
        critical desc file: /project/6102120/apero/nirps_bin/scripts/nirpsdl/assets/critical_checks_description.csv
        # system disk path
        # TODO: update this - does this work on this server?
        system disk path: /project/6102120/apero
        # system email server
        # TODO: update this - does this work on this server?
        system email server: 'None'


