spirou_mini2_07295_alliance:
    # general settings
    general:
        # instrument
        activate_instrument: spirou
        # profile (is in apero-activate)
        activate_profile: spirou_mini2_07295
        # directory where raw data is downloaded
        raw dir: /project/6102120/apero/spirou_data/private/spirou_raw_minidata2/
      # whether to link raw symlinks
        raw sym links: True
        # the apero profile to use (controlled sym link raw data directory and all
        #    apero reduced data directories)
        apero profile: /project/6102120/apero/spirou_bin/settings/spirou_mini2_07295
        # the install directory for apero (git hub repo)
        apero install: /project/6102120/apero/spirou_bin/scripts/apero_drs_07
        # directory where lbl files are processed
        lbl path: /project/6102120/apero/spirou_data/private/spirou_mini2_07295/lbl
        # apero version
        apero version: 0.7.XXX
        # start date if not using --obsdir argument
        start date: 2018-01-01
    # batch mode settings (cannot run multiple profiles in a single yaml in batch mode)
    batch:
      # whether to run in batch mode
      run batch: True
      # wall time
      time: '8:00:00'
      # nodes
      nodes: 1
      # cpus per task
      cpus per task: 192
      # memory
      mem: 0
      # account
      account: rrg-rdoyon
      # log path
      log path: /project/6102120/apero/spirou_data/private/spirou_mini2_07295/batch
      # apero bin path
      apero bin path: /project/6102120/apero/apero_bin
    # apero_processing settings
    processing:
        # apero processing run.ini file
        run file: mini_run2.ini
      # number of cores to use for processing
        cores: 70
        # reset data
        #  options are "None", "all" or a list "tmp", "red", "out"
        reset:
            - None
    # apero_get settings
    get-obj:
        # path to copy everything to
        out path: /project/6102120/apero/spirou_data/private/spirou_mini2_07295/objects
        # science fiber(s) to get
        science fibers:
            - AB
            - A
            - B
        calib fibers:
            - C
        # apero get valid header key: DRSOUTID (for apero red dir)
        science out types:
            - EXT_E2DS_FF
            - EXT_S1D_V
            - TELLU_OBJ
            - TELLU_RECON
            - TELLU_PCLEAN
            - SC1D_V_FILE
            - RC1D_V_FILE
            - CCF_RV
            - DRS_POST_E
            - DRS_POST_S
            - DRS_POST_T
            - DRS_POST_V
            - DRS_POST_P
            - EXT_S1D_W
            - SC1D_W_FILE
            - RC1D_W_FILE
        # input dpr types
        science dpr types:
            - POLAR_FP
            - POLAR_DARK
            - OBJ_FP
            - OBJ_DARK
        # apero template types
        template out types:
            - TELLU_TEMP
            - TELLU_TEMP_S1DV
        # sym links in apero get
        symlinks: True
        # reset options (if symlinks = True)
        reset:
            # - objects
    # apero_get settings for comm directory
    get-comm:
        # path to copy everything to
        out path: /project/6102120/apero/spirou_data/comm/spirou_mini2_07295
        # apero get valid header key: DRSOUTID (for apero red dir)
        science out types:
            - DRS_POST_E
            - DRS_POST_S
            - DRS_POST_T
            - DRS_POST_V
            - DRS_POST_P
            - LBL_FITS
            - LBL_RDB_FITS
            - LBL_RDB
            - LBL_RDB2
            - LBL_RDB_DRIFT
            - LBL_RDB2_DRIFT
        # input dpr types
        science dpr types:
            - POLAR_FP
            - POLAR_DARK
            - OBJ_FP
            - OBJ_DARK
        # apero template types
        template out types:
            - TELLU_TEMP
            - TELLU_TEMP_S1DV
            - TELLU_TEMP_S1DW
        # permissions file
        permissions file: /project/6102120/apero/spirou_bin/scripts/apero_drs_07/apero/tools/resources/get/spirou_permissions.yaml
        # group permissions file
        group file: /project/6102120/apero/spirou_bin/scripts/apero_drs_07/apero/tools/resources/get/apero_groups.yaml
        # group server
        group server: alliance
        # out suffix
        out suffix:
        # out prefix
        out prefix: 'APERO_v0.7_'
    # ari-settings
    ari:
        # ari profile
        profile: spirou_mini2_07295_alliance.yaml
        # mode (options are "old", "new" or "both")
        mode: both
        # local ari directory
        ari path: ~/.ari
        # cores to use for ari
        cores: 70
        # multiprocessing backend for ari (options are "threads", "processes")
        mp_backend: processes
        # multiprocessing start method for ari (options are "default", "fork", "spawn", "forkserver")
        mp_start_method: fork
    # check settings
    check:
        # whether to run check
        run_check: False